name: Build playlist search index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "playlists/server_*.m3u"
      - "build_search_index.py"
      - ".github/workflows/build_search_index.yml"

permissions:
  contents: write

concurrency:
  group: ratb-search-index
  cancel-in-progress: true

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and validate search index
        env:
          HUBLIVE_SERVERS_JSON_URL: ${{ vars.HUBLIVE_SERVERS_JSON_URL }}
        run: |
          if [ -z "$HUBLIVE_SERVERS_JSON_URL" ]; then
            echo "Repository variable HUBLIVE_SERVERS_JSON_URL is required."
            exit 1
          fi
          python build_search_index.py \
            --playlists playlists \
            --servers "$HUBLIVE_SERVERS_JSON_URL" \
            --output search-index

      - name: Commit generated index
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add search-index/manifest.json search-index/playlist_search.db.zip
          if git diff --cached --quiet; then
            echo "Search index is unchanged."
          else
            git commit -m "Update playlist search index [skip ci]"
            git push
          fi
